
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud Task Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Application Header -->
    <header>
        <h1>Cloud Task Manager</h1>
        <p>Organise your tasks and stay productive.</p>
    </header>

    <main>

        <!-- Authentication Section -->
        <section id="auth-section">

            <h2>Welcome</h2>

            <p>Log in or create an account to manage your tasks.</p>

            <!-- Login Form -->
            <form id="login-form">

                <h3>Login</h3>

                <input
                    type="email"
                    id="login-email"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="login-password"
                    placeholder="Password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <hr>

            <!-- Registration Form -->
            <form id="signup-form">

                <h3>Create Account</h3>

                <input
                    type="email"
                    id="signup-email"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="signup-password"
                    placeholder="Password (minimum 6 characters)"
                    minlength="6"
                    required
                >

                <button type="submit">Register</button>

            </form>

            <p id="auth-message"></p>

        </section>

        <!-- Logout Button -->
        <button id="logout-button" hidden>Logout</button>

        <!-- Task Management Section -->
        <section id="task-section" hidden>

            <h2>My Tasks</h2>
                        <!-- Task Statistics -->
            <div id="task-stats">

                <div class="stat-card">
                    <h3 id="total-tasks">0</h3>
                    <p>Total Tasks</p>
                </div>

                <div class="stat-card">
                    <h3 id="pending-tasks">0</h3>
                    <p>Pending</p>
                </div>

                <div class="stat-card">
                    <h3 id="completed-tasks">0</h3>
                    <p>Completed</p>
                </div>

            </div>
            

            <!-- Task Filters -->
            <div id="task-filters">

                <button
                    type="button"
                    class="filter-button active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="pending"
                >
                    Pending
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="completed"
                >
                    Completed
                </button>

            </div>

            <!-- Add Task Form -->
            <form id="task-form">

                <input
                    type="text"
                    id="task-input"
                    placeholder="Enter a new task..."
                    required
                >

                <button type="submit">Add Task</button>

            </form>

            <!-- Task List -->
            <div id="task-list">
                <!-- Tasks will appear here -->
            </div>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
